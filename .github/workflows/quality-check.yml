# ============================================================
# CI/CD QUALITY PIPELINE
# GitHub Actions Workflow
# ============================================================

name: Quality Check

# Run when code is pushed or a pull request is created/updated
on:
  push:
  pull_request:

jobs:
  quality-test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Run the Jest automated tests
      - name: Run Jest tests
        run: npm test

        

        

